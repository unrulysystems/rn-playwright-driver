name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Build packages
        run: nub run build

      # Auth for the PUBLIC npm registry is OIDC trusted publishing: all nine
      # packages name this repo and this workflow (release.yml) as their trusted
      # publisher on npmjs.com, and the job's `id-token: write` lets npm >= 11.5.1
      # exchange the Actions OIDC token for a short-lived publish credential. No
      # NPM_TOKEN is needed, and npm is retiring 2FA-bypass tokens anyway
      # (account changes Aug 2026, direct publishing Jan 2027).
      #
      # The step below stays only as an escape hatch: set an NPM_TOKEN secret and
      # it takes over. With the secret unset it writes nothing and OIDC is used.
      # Scoped packages publish public via each package's
      # publishConfig.access = "public".
      - name: Configure npm for public registry
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Run the test suite before publishing — the release-manifest invariant
      # (no workspace: specs shipped; published harness/bin only imports published
      # paths) lives in vitest. A broken @unrulysystems/rn-playwright-driver@0.4.0
      # already shipped once; this gate must run on the publish path, not only CI.
      - name: Run tests
        run: nub run test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: nub run release
          version: nub run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const publishedPackages = ${{ steps.changesets.outputs.publishedPackages }};
            const packageDirectories = {
              '@unrulysystems/rn-playwright-driver': 'driver',
              '@unrulysystems/rn-playwright-driver-runner': 'runner',
              '@unrulysystems/rn-playwright-driver-xctest-companion': 'xctest-companion',
              '@unrulysystems/rn-playwright-driver-instrumentation-companion': 'instrumentation-companion',
              '@unrulysystems/rn-driver-touch': 'rn-driver-touch',
              '@unrulysystems/rn-driver-view-tree': 'view-tree',
              '@unrulysystems/rn-driver-screenshot': 'screenshot',
              '@unrulysystems/rn-driver-lifecycle': 'lifecycle',
              '@unrulysystems/rn-driver-shared-types': 'shared-types',
            };
            for (const pkg of publishedPackages) {
              const tagName = `${pkg.name}@${pkg.version}`;
              const packageDirectory = packageDirectories[pkg.name] ?? pkg.name.replace(/^@[^/]+\//, '');
              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: tagName,
                  body: `## ${pkg.name}@${pkg.version}\n\nSee [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/packages/${packageDirectory}/CHANGELOG.md) for details.`,
                  draft: false,
                  prerelease: false,
                });
                console.log(`Created release for ${tagName}`);
              } catch (error) {
                console.log(`Release for ${tagName} may already exist: ${error.message}`);
              }
            }
