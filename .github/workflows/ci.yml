name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Run typecheck
        run: nub run typecheck

      - name: Run lint
        run: nub run lint

      - name: Check formatting
        run: nub run format:check

      - name: Run tests
        run: nub run test

      - name: Check code duplication
        run: nub run cpd

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Build packages
        run: nub run build

  footprint:
    name: Release footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Build packages
        run: nub run build

      # REQ-SEAM-009/010: the example app's release export, Metro-served bundle and prebuild carry
      # the driver only under RN_E2E=1, and never in an export. Runs on Linux: prebuild --no-install
      # generates both native projects and the autolinking resolve needs no toolchain.
      - name: Check release footprint
        run: nub run check:footprint
        working-directory: examples/basic-app

  # E2E tests require a real device/simulator and are run locally or on self-hosted runners.
  # Official example confidence gates:
  # - cd examples/basic-app && nub run test:e2e:android --device '<android-serial>'
  # - cd examples/basic-app && nub run test:e2e:ios --device '<simulator-name-or-udid>'
  # See docs/CI.md for iOS Simulator and Android Emulator setup.
