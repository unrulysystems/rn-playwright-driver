mission: 1
id: native-e2e-clean-seam
title: Native e2e through the RN Playwright driver with zero test code in the app
outcome: Send's e2e suites, web and native, are dogfooded green on the redesign branch; the native lane runs on the driver's marker-gated Metro seam with no test branch in app source; and the driver holds its "no test code in the app binary" promise with a two-direction artifact check in CI.
rubric:
  - id: SEAM-001
    criterion: The harness installs from Metro config under the runner's marker; the reference consumer's app source has no driver import and no marker read.
    floor: examples/basic-app e2e green on iOS and Android through rn-driver test with withRnDriverHarness as the only install; check:footprint grep over app entry and app config passes.
    status: met
    evidence: "Bug bash round 4 (fresh participant, HEAD aa5249f) task 1 green: docs-alone adoption with no driver-source reading; live iOS e2e on rnpd-clean-seam exit 0, 62 passed / 4 skipped, reproduced in rounds 2, 3 and 4. LOOP.md U10 round 4 entry."
  - id: SEAM-002
    criterion: Driver native modules are absent from production prebuilds by default and present under the marker.
    floor: check:footprint prebuild direction passes both ways on the example app.
    status: met
    evidence: "Bug bash round 4 task 4: marker-off `expo prebuild` -> 0 of 246 pods match the driver, no UITests target, only the exclusion line references it. Round 3 measured the autolinking resolver directly: 21 modules incl. all four driver modules without the exclusion, 17 and zero with it, on both platforms."
  - id: SEAM-003
    criterion: The promise is held by a CI job, not a sentence.
    floor: check:footprint runs in .github/workflows/ci.yml and was observed red on a planted regression before green.
    status: met
    evidence: CI job `Release footprint` at .github/workflows/ci.yml:53,71 runs `examples/basic-app` `check:footprint`; green at 17/17 assertions in round 4, and observed red in U7 against a planted `RN_E2E` read in index.ts and a plugin that stops excluding (/tmp/rnpd/footprint-planted.log, 5 FAILs).
  - id: SEAM-004
    criterion: The remaining leaks are closed — the dev gate folds, the frame counter is lazy, the companion plugin owns its native side effects, the harness needs no consumer resolver override.
    floor: unit tests for REQ-SEAM-005, -006, -008 and the example app's Android companion run with no consumer plugin.
    status: met
    evidence: "U2: harness/dev gates on __DEV__ alone and the frame counter starts lazily, tests observed red then green. Bug bash round 4 task 3: `expo export` Hermes source hash identical across marker states (efc47f53e1148e83612ceaee70a9994fcf03361c) and `expo export:embed --dev false` byte-identical (1,045,379 bytes, cmp clean), 0 hits for nine driver strings."
  - id: SEAM-005
    criterion: Send's native lane runs on the seam.
    floor: apps/expo smoke spec green on an iOS simulator and an Android emulator via rn-driver test against the worktree's localnet, twice; app-test-footprint.test.ts green with no exemption for app source.
    status: met
    evidence: "Earned on aem5, which owns the devices (sendapp bb/native-e2e-clean-seam, campaign units V4/V5): iOS smoke green twice on simulator rnpd-clean-seam, Android smoke green twice on emulator-5554 (Pixel_7_API_35), both via rn-driver test against the worktree's localnet; Metro footprint detector green with no exemption for app source. The smoke spec asserts the rendered signed-out surface by testID, so a green run proves the app booted and rendered rather than only that the driver attached. Recorded in ~/.handoffs/native-e2e-clean-seam-handoff.md and PR #7264."

  - id: SEAM-006
    criterion: Send's web e2e suite is dogfooded on the redesign branch.
    floor: the suite runs at CI parity (served production build, --workers=1) on the worktree's localnet and a chartered bug bash terminates green or findings with every finding drafted for filing.
    status: met
    evidence: "Earned on onyx (sendapp bb/native-e2e-clean-seam @ bc14cbecc, campaign units V6/V7). CI parity: two back-to-back passes of the #4637 seven-spec set, 41 tests, --workers=1 against a served production build with CI base-leg flags, 39/41 each with an identical failure set that is a strict subset of the ten-test nightly CI baseline (run 33950341699); artifact tied to the runs by served chunk 3902-ca4b64aa881020aa.js and BUILD_ID -lzZTGxz5YJ2ezKKbWsZv. Bug bash: chartered six-task fresh-participant run terminated `findings` with one major, traced to the already-open #6681 and evidenced as outside the lane's diff, plus ten below-floor findings drafted in ~/.handoffs/native-e2e-clean-seam-bugbash-findings.md."

boundary:
  - publish
  - npm-release
  - merge-tracked-ref
  - github-mutation
